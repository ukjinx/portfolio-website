<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-gallery.css">
    <link rel="icon" type="image/x-icon" href="gallery1/favicon.png">
    <title>Joe Jenkinson Photography</title>
</head>

<body>

    <!-- =========================
         Navigation
    ========================== -->

    <div id="nav-placeholder"></div>

    <!-- =========================
         Gallery
    ========================== -->

    <main
        class="gallery"
        id="gallery"
        data-gallery="animals"
    ></main>

    <!-- =========================
         Lightbox
    ========================== -->

    <div id="lightbox">

        <button id="closeLightbox">
            &times;
        </button>

        <button class="lightbox-nav prev" id="prevBtn">
            &#10094;
        </button>

        <img id="lightbox-img" alt="">

        <button class="lightbox-nav next" id="nextBtn">
            &#10095;
        </button>

    </div>

    <!-- =========================
         Footer
    ========================== -->

    <div id="footer-placeholder"></div>

    <script src="gallery.js"></script>
    <script src="script.js"></script>

</body>

</html>
